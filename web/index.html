<!DOCTYPE html>
<html>
<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="flutte">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>flutte</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Estilo para evitar que a tela fique branca enquanto carrega */
    body {
      background-color: #0D47A1; /* O azul escuro que você escolheu */
      margin: 0;
      padding: 0;
    }
  </style>
</head>
<body>
  <script>
    {{footer_script}}
    
    // Configuração manual do Flutter para forçar o renderizador HTML
    window.addEventListener('load', function(ev) {
      _flutter.loader.load({
        onEntrypointLoaded: function(engineInitializer) {
          engineInitializer.initializeEngine({
            renderer: "html", // ISSO AQUI RESOLVE A TELA BRANCA
          }).then(function(appRunner) {
            appRunner.runApp();
          });
        }
      });
    });
  </script>
  <script src="flutter_bootstrap.js"></script>
</body>
</html>
